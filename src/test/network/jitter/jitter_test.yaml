general:
    stop_time: 30
    seed: 12345

network:
    graph:
        type: gml
        inline: |
            graph [
              directed 0
              node [
                id 0
                host_bandwidth_down "1 Gbit"
                host_bandwidth_up "1 Gbit"
              ]
              node [
                id 1
                host_bandwidth_down "1 Gbit"
                host_bandwidth_up "1 Gbit"
              ]
              edge [
                source 0
                target 0
                latency "1 ms"
                jitter "0 ms"
                packet_loss 0.0
              ]
              edge [
                source 1
                target 1
                latency "1 ms"
                jitter "0 ms"
                packet_loss 0.0
              ]
              edge [
                source 0
                target 1
                latency "50 ms"
                jitter "10 ms"
                packet_loss 0.0
              ]
              edge [
                source 1
                target 0
                latency "50 ms"
                jitter "10 ms"
                packet_loss 0.0
              ]
            ]

hosts:
    server:
        network_node_id: 0
        processes:
            - path: ./test_jitter
              args: server
              start_time: 1
              expected_final_state: { exited: 0 }
    client:
        network_node_id: 1
        processes:
            - path: ./test_jitter
              args: client server
              start_time: 2
              expected_final_state: { exited: 0 }
